name = "pfd-mcp"
compatibility_date = "2026-10-01"
main = "src/index.mjs"

# Public MCP server (Streamable HTTP, stateless). Worker code runs per request,
# so this is NOT assets-only. It reads only public data from the origin and the
# events mirror, cached 10 min via the Cache API — no origin database access.
#
# Served on the site's own domain. The custom domain is attached once in the
# Cloudflare dashboard (Workers & Pages -> pfd-mcp -> Settings -> Domains &
# Routes -> Add -> Custom Domain: mcp.propfirmdiscount.com), the same way the
# other workers here get theirs. workers_dev is off so no account-identifying
# *.workers.dev address exists to leak.
workers_dev = false