name: Hourly Sync

on:
  schedule:
    # Hourly at minute 31 (offset from busy :00 slots).
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mirror repo
        uses: actions/checkout@v5

      - name: Fetch dataset
        run: |
          set -euo pipefail
          # Cache-bust query: Cloudflare caches the canonical API URLs for
          # well over their max-age=300, so a fresh deploy can sit behind a
          # stale edge copy for hours. A per-run timestamp makes the URL
          # unique per run and always hits origin.
          BUST="t=$(date +%s)"
          curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/api/prop-firm-codes/?$BUST" -o datasets/prop-firm-codes.json
          curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/api/prop-firm-codes/?format=html&$BUST" -o datasets/prop-firm-codes.html

      - name: Fetch markdown mirrors
        run: |
          set -euo pipefail
          MD_PATHS=(
            ""
            "best-prop-firm-discounts"
            "prop-firms-list"
            "prop-firm-reviews"
          )
          # Every category with posts mirrors on the site; the category
          # sitemap (hide_empty) is exactly that list.
          MD_PATHS+=($(curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/category-sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's|^https://propfirmdiscount.com/||;s|/$||' | sed 's|^category/|category/|'))
          # Indexable tags (>= 10 posts) — same list the tag sitemap carries.
          MD_PATHS+=($(curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/tag-sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's|^https://propfirmdiscount.com/||;s|/$||'))
          # Event tags mirrored below the indexability threshold (whitelisted
          # in the mu-plugin); the tag sitemap does not carry them, so they
          # are listed here to survive both the fetch and the prune pass.
          for t in fathers-day holi-festival international-womens-day international-workers-day lunar-new-year mothers-day presidents-day; do MD_PATHS+=("tag/$t"); done
          FIRM_SLUGS=$(curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/dealstore-sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | sed 's|.*/prop-firm/||;s|/$||')
          mkdir -p md
          for p in "${MD_PATHS[@]}"; do
            name="${p:-home}"
            mkdir -p "md/$(dirname "$name")"
            curl -sf --retry 3 --retry-delay 30 "https://propfirmdiscount.com/$p/md" -o "md/$name.md" || echo "WARN: no mirror at /$p/md"
          done
          # Drop category/tag mirrors no longer in the sitemaps. rel matches
          # MD_PATHS exactly (no leading slash — deal-paths.txt is the only
          # list that keeps one, its URLs being absolute paths).
          find md/category md/tag -name '*.md' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            rel="${f#md/}"
            rel="${rel%.md}"
            echo "${MD_PATHS[*]}" | tr ' ' '\n' | grep -qx "$rel" || rm "$f"
          done
          find md/category md/tag -type d -empty -delete 2>/dev/null || true
          for slug in $FIRM_SLUGS; do
            mkdir -p md/prop-firm
            curl -sf --retry 2 --retry-delay 15 "https://propfirmdiscount.com/prop-firm/$slug/md" -o "md/prop-firm/$slug.md" || echo "WARN: no mirror for $slug"
          done
          # Drop firm mirrors for terms no longer in the dealstore sitemap.
          for f in md/prop-firm/*.md; do
            slug="$(basename "$f" .md)"
            echo "$FIRM_SLUGS" | grep -qx "$slug" || rm "$f"
          done

      - name: Fetch deal-post mirrors (latest deal per firm)
        run: |
          set -euo pipefail
          # Deal-post mirrors, ONE per firm: the firm's newest deal
          # (highest lastmod in the deal sitemap). The site serves /md for
          # every published deal post; this repo keeps only the newest of
          # each firm so the mirror tree stays small — md/ {count of firms}
          # files instead of one file per deal.
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/deal-sitemap.xml -o deal-sitemap.xml
          python3 -c "
          import re
          xml = open('deal-sitemap.xml', encoding='utf-8').read()
          newest = {}
          for loc, lastmod in re.findall(r'<loc>([^<]+)</loc>\s*<lastmod>([^<]+)</lastmod>', xml):
              path = loc.strip().rstrip('/').replace('https://propfirmdiscount.com', '')
              m = re.match(r'^/deals/([a-z0-9-]+)/', path)
              if m and (m.group(1) not in newest or lastmod > newest[m.group(1)][0]):
                  newest[m.group(1)] = (lastmod, path)
          for lastmod, path in newest.values():
              print(path)
          " > deal-paths.txt
          rm -f deal-sitemap.xml
          DEAL_PATHS=$(cat deal-paths.txt)
          echo "Mirroring $(echo "$DEAL_PATHS" | grep -c .) firm-latest deals"
          echo "$DEAL_PATHS" | while read -r p; do
            [ -n "$p" ] || continue
            mkdir -p "md$(dirname "$p")"
            curl -sf --retry 2 --retry-delay 15 "https://propfirmdiscount.com$p/md" -o "md$p.md" || echo "WARN: no mirror at $p/md"
          done
          # Keep exactly one deal mirror per firm: anything under md/deals/
          # that is not this run's firm-latest path goes.
          find md/deals -name '*.md' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            rel="${f#md}"
            rel="${rel%.md}"
            echo "$DEAL_PATHS" | grep -qx "$rel" || rm "$f"
          done
          find md/deals -type d -empty -delete 2>/dev/null || true

      - name: Fetch discovery files
        run: |
          set -euo pipefail
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/llms.txt -o llms.txt
          curl -sf --retry 3 --retry-delay 30 https://propfirmdiscount.com/ai.txt -o ai.txt

      - name: Update README answer-unit, exclusive list and sync stamp
        run: |
          set -euo pipefail
          # Exported, not just set: the python blocks below run in a quoted
          # heredoc, so a plain shell variable never reaches them.
          export STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Answer-unit: the biggest standing code in the dataset, so the
          # repo's front page (GitHub renders README.md on the repo root —
          # its highest-authority URL) always leads with a quotable answer.
          # Falls back to leaving the previous line untouched if python
          # cannot parse the dataset.
          python3 - <<'PY' || true
          import json, os, re
          # Read the Exclusive table from md/home.md mirror
          try:
              home = open('md/home.md', encoding='utf-8').read()
          except Exception:
              raise SystemExit(0)
          lines = home.splitlines()
          start = next((i for i, l in enumerate(lines)
                        if l.strip() == '## Exclusive Prop Firm Discount Codes'), None)
          if start is None:
              raise SystemExit(0)
          # Parse the table rows
          rows = []
          for l in lines[start + 1:]:
              if l.startswith('|') and not l.startswith('|---'):
                  parts = [p.strip() for p in l.split('|')]
                  # Format: | # | Prop firm | Exclusive code | Discount | Offer ends | Firm page |
                  if len(parts) >= 6 and parts[1] and parts[1] != '#':
                      rows.append(parts)
              elif rows:
                  break
          # Extract firms with discount percentages
          firms = []
          for parts in rows:
              firm = parts[2]  # Prop firm
              code = parts[3]  # Exclusive code
              discount = parts[4]  # Discount
              m = re.search(r'(\d+(?:\.\d+)?)\s*%', discount)
              if m:
                  firms.append((float(m.group(1)), code, firm))
          # Sort descending by percentage, take top 5
          firms.sort(key=lambda x: x[0], reverse=True)
          top5 = firms[:5]
          if not top5:
              raise SystemExit(0)
          # Build the sentence fragments
          parts = []
          for pct, code, firm in top5:
              parts.append(f"{int(pct)}% OFF with code {code} at {firm}")
          # Join: "X, Y and Z" (with Oxford comma for 3+)
          if len(parts) == 1:
              joined = parts[0]
          elif len(parts) == 2:
              joined = f"{parts[0]} and {parts[1]}"
          else:
              joined = ', '.join(parts[:-1]) + f", and {parts[-1]}"
          line = ("As of {date}, the biggest verified prop firm discount codes are "
                  "{codes}.").format(
              date=os.environ['STAMP'][:10], codes=joined)
          md = open('README.md', encoding='utf-8').read()
          md = re.sub(r'(?<=<!-- pfd-top-code \(auto-updated each sync\) -->\n).*?(?=\n\n)',
                      lambda _: line, md, count=1)
          open('README.md', 'w', encoding='utf-8').write(md)
          PY
          # Exclusive list: the homepage's partner-code table, copied from the
          # md/home.md mirror fetched above, so the repo's front page leads
          # with the codes that always work and not only this month's
          # campaigns. Falls back to leaving the previous block untouched if
          # the mirror is missing or the section is gone.
          python3 - <<'PY' || true
          import re
          try:
              home = open('md/home.md', encoding='utf-8').read()
          except Exception:
              raise SystemExit(0)
          lines = home.splitlines()
          start = next((i for i, l in enumerate(lines)
                        if l.strip() == '## Exclusive Prop Firm Discount Codes'), None)
          if start is None:
              raise SystemExit(0)
          table = []
          for l in lines[start + 1:]:
              if l.startswith('|'):
                  table.append(l)
              elif table:
                  break
          # Header row, separator row, at least one firm.
          if len(table) < 3:
              raise SystemExit(0)
          block = '## Exclusive Prop Firm Discount Codes\n\n' + '\n'.join(table)
          md = open('README.md', encoding='utf-8').read()
          md = re.sub(r'(?<=<!-- pfd-exclusive \(auto-updated each sync\) -->\n)'
                      r'.*?(?=\n<!-- /pfd-exclusive -->)',
                      lambda _: block, md, count=1, flags=re.S)
          open('README.md', 'w', encoding='utf-8').write(md)
          PY
          sed -i "s|Last synced: .*|Last synced: $STAMP (auto, hourly)|" README.md

      - name: Push Hugging Face mirror
        # HF dataset mirror (propfirmdiscounts/prop-firm-discount-codes):
        # same content as this repo, on a second distribution channel.
        # Runs after the GitHub commit so HF never gets content that failed
        # to land here first. Skipped silently when HF_TOKEN is unset.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          pip install --quiet 'huggingface_hub>=2.0'
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo = 'propfirmdiscounts/prop-firm-discount-codes'
          for folder in ('datasets', 'md'):
              api.upload_folder(folder_path=folder, path_in_repo=folder,
                                repo_id=repo, repo_type='dataset',
                                commit_message='Hourly sync')
          for f in ('llms.txt', 'ai.txt'):
              api.upload_file(path_or_fileobj=f, path_in_repo=f,
                              repo_id=repo, repo_type='dataset',
                              commit_message='Hourly sync')
          # HF README must keep the dataset-card frontmatter (tags, configs)
          # or the dataset drops out of HF search; the repo README has none.
          front = ('---\n'
                   'license: other\n'
                   'configs:\n'
                   '- config_name: prop-firm-codes\n'
                   '  data_files:\n'
                   '  - split: data\n'
                   '    path: datasets/prop-firm-codes.json\n'
                   'tags:\n'
                   '- discount-codes\n'
                   '- trading\n'
                   '- prop-firm\n'
                   '- funded-trader\n'
                   '- finance\n'
                   'size_categories:\n'
                   '- 100K<n<1M\n'
                   '---\n\n')
          body = open('README.md', encoding='utf-8').read()
          open('hf-card.md', 'w', encoding='utf-8').write(front + body)
          api.upload_file(path_or_fileobj='hf-card.md', path_in_repo='README.md',
                          repo_id=repo, repo_type='dataset',
                          commit_message='Hourly sync')
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -m "Hourly snapshot of the public dataset and markdown mirrors."
          git push
